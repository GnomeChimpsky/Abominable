;; Abominable native-widescreen profile for DxWrapper
[General]
RealDllPath                = AUTO
WrapperMode                = AUTO
LoadCustomDllPath          = abom_widescreen_854.dll
DisableLogging             = 0

[Plugins]
LoadPlugins                = 0

[Compatibility]
Dd7to9                     = 1
D3d8to9                    = 0
D3d9to9Ex                  = 0
D3d9on12                   = 0
DDrawCompat                = 0
Dinputto8                  = 0
EnableDdrawWrapper         = 0
EnableD3d9Wrapper          = 0
EnableDinput8Wrapper       = 0
EnableDsoundWrapper        = 0

[ddraw]
DdrawOverrideBitMode       = 0
DdrawUseDirect3D9Caps      = 0

[Dd7to9]
DdrawAutoFrameSkip         = 0
DdrawEmulateSurface        = 0
DdrawEmulateLock           = 0
DdrawUseShadowSurface      = 0
DdrawCustomWidth           = 0
DdrawCustomHeight          = 0
DdrawLinearTextureFilter   = 0
DdrawUseNativeResolution   = 0
DdrawOverrideWidth         = 0
DdrawOverrideHeight        = 0
DdrawMaintainAspectRatio   = 0

[d3d9]
EnableVSync                = 0
ShowFPSCounter             = 0
OverrideRefreshRate        = 0
LimitRefreshRates          = 0
LimitPerFrameFPS           = 0
EnableWindowMode           = 1
WindowModeBorder           = 1
FullscreenWindowMode       = 0
EnableCursorClip           = 0
ForceExclusiveFullscreen   = 0

[FullScreen]
FullScreen                 = 0
ForceWindowResize          = 0
WaitForWindowChanges       = 0

[dinput8]
DeviceLookupCacheTime      = 0
FilterNonActiveInput       = 0

[dsound]
ForceSoftwareMixing        = 0
ForcePrimaryBufferFormat   = 0
